name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.8.1
        with:
          pixi-version: latest
          cache: true

      - name: Cache ARM toolchain
        uses: actions/cache@v4
        with:
          path: .toolchain
          key: toolchain-arm-gnu-13.3.rel1-linux-x64

      - name: Cache Pico SDK
        uses: actions/cache@v4
        with:
          path: .pico-sdk
          key: pico-sdk-2.1.1

      - name: Build
        run: pixi run build

      - name: Upload firmware artifact
        uses: actions/upload-artifact@v4
        with:
          name: hendl-firmware-${{ github.sha }}
          path: build/hendl.uf2
          retention-days: 30
